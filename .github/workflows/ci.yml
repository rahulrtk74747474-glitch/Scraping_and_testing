name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src app.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Public Chartink browser-scraping smoke test
        env:
          CHARTINK_SCAN_URL: https://chartink.com/screener/scan-c
        run: |
          python - <<'PY'
          from src.chartink import fetch_chartink_signals
          rows = fetch_chartink_signals(timeout=60)
          print(f"Browser scraping succeeded. Rows returned: {len(rows)}")
          print("Sample symbols:", [r["symbol"] for r in rows[:10]])
          PY
