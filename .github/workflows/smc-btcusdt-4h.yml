name: BTCUSDT SMC Clean Wave 4h paper trader

on:
  schedule:
    - cron: "10 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".smc-btcusdt-trigger"

permissions:
  contents: write

concurrency:
  group: smc-btcusdt-4h-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated SMC branch
        uses: actions/checkout@v4
        with:
          ref: smc-btcusdt-4h-paper
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run BTCUSDT 4h SMC paper trader
        run: python -m src.smc_clean_wave_paper

      - name: Commit SMC state and report
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "smc-btcusdt-paper-bot"
          git config user.email "smc-btcusdt-paper-bot@users.noreply.github.com"
          git add data/smc_btcusdt_*.csv data/smc_btcusdt_state.json data/trade_journal.csv reports/smc_btcusdt_latest.md reports/trade_journal.md
          git commit -m "chore: BTCUSDT 4h SMC paper update"
          git push origin HEAD:smc-btcusdt-4h-paper
