name: NIFTY SMC Clean Wave 15m paper trader

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".smc-nifty-trigger"

permissions:
  contents: write

concurrency:
  group: smc-nifty-15m-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated SMC branch
        uses: actions/checkout@v4
        with:
          ref: smc-nifty-15m-paper
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run NIFTY 15m SMC paper trader
        run: python -m src.smc_clean_wave_paper

      - name: Commit SMC state and report
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "smc-nifty-paper-bot"
          git config user.email "smc-nifty-paper-bot@users.noreply.github.com"
          git add data/smc_nifty_*.csv data/smc_nifty_state.json data/trade_journal.csv reports/smc_nifty_latest.md reports/trade_journal.md
          git commit -m "chore: NIFTY 15m SMC paper update"
          git push origin HEAD:smc-nifty-15m-paper
