name: BTCUSDT paper CI

on:
  push:
    branches: [btcusdt-paper]
    paths:
      - "src/btc_*.py"
      - "tests/test_btc_paper.py"
      - ".github/workflows/btc-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile BTC modules
        run: python -m compileall -q src/btc_market.py src/btc_strategy.py src/btc_paper.py src/btc_main.py
      - name: Unit tests
        run: python -m unittest tests.test_btc_paper -v
      - name: Binance public-data smoke test
        run: |
          python - <<'PY'
          from src.btc_market import fetch_recent_klines
          bars = fetch_recent_klines(limit=5)
          assert bars, "No closed BTCUSDT bars returned"
          print("Latest closed BTCUSDT 15m candle:", bars[-1])
          PY
