name: BTCUSDT Order Block 15m paper trader

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".ob-btcusdt-trigger"

permissions:
  contents: write

concurrency:
  group: ob_btcusdt-15m-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated paper branch
        uses: actions/checkout@v4
        with:
          ref: ob-btcusdt-15m-paper
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run 15m order-block paper trader
        run: python -m src.order_block_paper

      - name: Commit state and reports to ob-btcusdt-15m-paper only
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "ob-btcusdt-paper-bot"
          git config user.email "ob-btcusdt-paper-bot@users.noreply.github.com"
          git add data/ob_btcusdt_*.csv data/ob_btcusdt_state.json data/trade_journal.csv reports/ob_btcusdt_latest.md reports/trade_journal.md
          git commit -m "chore: ob_btcusdt 15m order-block paper update"
          git push origin HEAD:ob-btcusdt-15m-paper
