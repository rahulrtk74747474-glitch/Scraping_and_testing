name: Vertex daily paper trade

on:
  workflow_dispatch:
  schedule:
    # 11:15 UTC = 16:45 IST. GitHub cron uses UTC.
    - cron: "15 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: vertex-daily-paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for Chartink scraping
        run: python -m playwright install --with-deps chromium
      - name: Run daily engine
        env:
          CHARTINK_SCAN_URL: https://chartink.com/screener/rahul-606569
          CHARTINK_USER: ${{ secrets.CHARTINK_USER }}
          CHARTINK_PASSWORD: ${{ secrets.CHARTINK_PASSWORD }}
          CHARTINK_COOKIE: ${{ secrets.CHARTINK_COOKIE }}
        run: python -m src.main
      - name: Commit daily state and reports
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "vertex-paper-bot"
          git config user.email "vertex-paper-bot@users.noreply.github.com"
          git add data reports
          git commit -m "chore: daily paper-trading update"
          git push
